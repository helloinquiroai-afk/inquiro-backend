spring.application.name=inquiro-backend
server.port=${PORT:8080}
# Set native only behind a trusted reverse proxy which sanitizes forwarded headers.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.error.include-message=never
server.error.include-stacktrace=never

openai.api-key=${OPENAI_API_KEY:${INQUIRO_OPENAI_API_KEY:}}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.connect-timeout-seconds=${OPENAI_CONNECT_TIMEOUT_SECONDS:5}
openai.read-timeout-seconds=${OPENAI_READ_TIMEOUT_SECONDS:30}
openai.max-concurrent-requests=${OPENAI_MAX_CONCURRENT_REQUESTS:8}

messenger.verify-token=${FACEBOOK_VERIFY_TOKEN:${INQUIRO_MESSENGER_VERIFY_TOKEN:}}
messenger.page-access-token=${FACEBOOK_PAGE_ACCESS_TOKEN:${INQUIRO_MESSENGER_ACCESS_TOKEN:}}
messenger.page-id=${FACEBOOK_PAGE_ID:}
messenger.app-secret=${FACEBOOK_APP_SECRET:}
messenger.graph-api-version=${FACEBOOK_GRAPH_API_VERSION:v26.0}
messenger.worker-enabled=${MESSENGER_WORKER_ENABLED:true}
messenger.poll-interval-ms=1000
messenger.connect-timeout-seconds=5
messenger.read-timeout-seconds=20
messenger.max-send-attempts=5
messenger.max-payload-bytes=1048576

whatsapp.access-token=${INQUIRO_WHATSAPP_ACCESS_TOKEN:}
whatsapp.phone-number-id=${INQUIRO_WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.verify-token=${INQUIRO_WHATSAPP_VERIFY_TOKEN:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:${FACEBOOK_APP_SECRET:}}

inquiro.seed-default-business=${SEED_DEFAULT_BUSINESS:true}
inquiro.default-business-id=${DEFAULT_BUSINESS_ID:biz_001}
inquiro.website-channel-id=${WEBSITE_CHANNEL_ID:website-default}
inquiro.management-api-key=${INQUIRO_MANAGEMENT_API_KEY:}
inquiro.auth.session-ttl-hours=${INQUIRO_AUTH_SESSION_TTL_HOURS:24}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/inquiro}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DATABASE_DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.datasource.hikari.maximum-pool-size=${DATABASE_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:30000}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO

# Browser CORS allow-list. Empty means no cross-origin browser access.
inquiro.security.allowed-origins=${INQUIRO_SECURITY_ALLOWED_ORIGINS:}

inquiro.security.credential-encryption-key=${INQUIRO_CREDENTIAL_ENCRYPTION_KEY:}
inquiro.security.credential-key-version=${INQUIRO_CREDENTIAL_KEY_VERSION:1}

inquiro.security.credential-encryption-key-previous=${INQUIRO_CREDENTIAL_ENCRYPTION_KEY_PREVIOUS:}

# Phase 44 API abuse protection. The default in-memory limiter is per instance; use a distributed store in the scaling milestone.
inquiro.rate-limit.enabled=${INQUIRO_RATE_LIMIT_ENABLED:true}
inquiro.rate-limit.requests-per-minute=${INQUIRO_RATE_LIMIT_REQUESTS_PER_MINUTE:60}
inquiro.rate-limit.authenticated-requests-per-minute=${INQUIRO_RATE_LIMIT_AUTHENTICATED_REQUESTS_PER_MINUTE:120}
inquiro.rate-limit.public-ai-requests-per-minute=${INQUIRO_RATE_LIMIT_PUBLIC_AI_REQUESTS_PER_MINUTE:20}
inquiro.rate-limit.auth-requests-per-minute=${INQUIRO_RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:10}
inquiro.rate-limit.webhook-requests-per-minute=${INQUIRO_RATE_LIMIT_WEBHOOK_REQUESTS_PER_MINUTE:120}
inquiro.rate-limit.max-request-body-bytes=${INQUIRO_MAX_REQUEST_BODY_BYTES:1048576}
inquiro.rate-limit.burst=${INQUIRO_RATE_LIMIT_BURST:10}
