spring.application.name=inquiro-backend
openai.api-key=${INQUIRO_OPENAI_API_KEY}
openai.model=gpt-4.1-mini
# WhatsApp Cloud API
whatsapp.access-token=${INQUIRO_WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=1206166309256762
whatsapp.verify-token=${INQUIRO_WHATSAPP_VERIFY_TOKEN}
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# messenger:
messenger.verify-token=${INQUIRO_MESSENGER_VERIFY_TOKEN}
messenger.page-access-token=${INQUIRO_MESSENGER_ACCESS_TOKEN}

# =========================================================
# Database - H2 development database
# =========================================================

spring.datasource.url=jdbc:h2:file:./data/inquiro
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 browser console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console