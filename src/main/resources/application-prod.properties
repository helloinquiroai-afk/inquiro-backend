spring.config.activate.on-profile=prod
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.h2.console.enabled=false
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
inquiro.seed-default-business=${SEED_DEFAULT_BUSINESS:false}
inquiro.security.allowed-origins=${INQUIRO_SECURITY_ALLOWED_ORIGINS:}
inquiro.rate-limit.enabled=${INQUIRO_RATE_LIMIT_ENABLED:true}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
logging.level.root=${LOG_LEVEL_ROOT:INFO}
