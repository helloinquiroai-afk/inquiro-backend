name: E2E Production Smoke

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  e2e-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start production integration stack
        run: docker compose -f docker-compose.integration.yml up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness >/tmp/readiness.json; then
              cat /tmp/readiness.json
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.integration.yml logs --no-color
          exit 1

      - name: Run Phase 59 API E2E smoke test
        env:
          BASE_URL: http://127.0.0.1:8080
        run: |
          python3 scripts/phase-59-e2e-smoke-test.py

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
