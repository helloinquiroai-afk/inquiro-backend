name: Backup Restore Validation

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  postgres-backup-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start real production PostgreSQL stack
        run: |
          docker compose -f docker-compose.integration.yml up -d --build

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.integration.yml logs --no-color
          exit 1

      - name: Create restore sentinel in migrated database
        run: |
          docker compose -f docker-compose.integration.yml exec -T postgres             psql -U inquiro -d inquiro_test -v ON_ERROR_STOP=1             -c "CREATE TABLE phase57_restore_sentinel (id INTEGER PRIMARY KEY, payload TEXT NOT NULL);                 INSERT INTO phase57_restore_sentinel(id, payload) VALUES (1, 'phase-57-backup-restore-ok');"

      - name: Execute repository backup and restore scripts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/backups/phase-57"
          docker compose -f docker-compose.integration.yml run --rm             -v "$GITHUB_WORKSPACE/scripts:/phase57-scripts:ro"             -v "$GITHUB_WORKSPACE/backups/phase-57:/phase57-backups"             -e POSTGRES_HOST=postgres             -e POSTGRES_PORT=5432             -e POSTGRES_DB=inquiro_test             -e POSTGRES_USER=inquiro             -e POSTGRES_PASSWORD=integration-password             -e BACKUP_DIR=/phase57-backups             postgres             sh /phase57-scripts/backup-restore-smoke-test.sh

      - name: Verify backup artifact exists
        run: |
          test -n "$(find backups/phase-57 -type f -name '*.dump' -size +0c -print -quit)"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
